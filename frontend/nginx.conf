server {
    listen 80;
    root /usr/share/nginx/html;

    # SPA: unknown paths (/admin, /admin/scan) → app shell, so refresh works
    location / {
        try_files $uri $uri/index.html /200.html;
    }

    # hashed JS/CSS files never change → cache for a year
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
